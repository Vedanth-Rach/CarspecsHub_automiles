<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CarSpecs India</title>
    <!-- Assuming styles.css contains the shared utility styles -->
    <link rel="stylesheet" href="styles.css"> 
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Page-specific styling is in styles.css -->
</head>
<body>
    <div class="hero">
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="logo-pill" aria-hidden="true">
                    <div class="logo-icon"><i class="fas fa-car"></i></div>
                    <div class="logo-text">
                        <div class="logo-text-title">CarSpecs India</div>
                        <div class="logo-text-sub">Secure Access Portal</div>
                    </div>
                </div>

                <!-- Message Box for error/info -->
                <div id="messageBox" class="message-box"></div>

                <!-- Login form -->
                <form id="loginForm" action="/login" method="POST">
                    <div class="auth-title">Sign In</div>
                    <div class="auth-subtitle">Sign in to continue to CarSpecsHub</div>

                    <div class="form-group input-group">
                        <label class="input-label" for="email">Email address</label>
                        <div class="input-wrapper">
                            <span class="input-icon"><i class="fas fa-envelope"></i></span>
                            <input type="email" id="email" name="email" placeholder="you@example.com" required>
                        </div>
                    </div>

                    <div class="form-group input-group">
                        <label class="input-label" for="password">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon"><i class="fas fa-lock"></i></span>
                            <input type="password" id="password" name="password" placeholder="Your password" required>
                        </div>
                    </div>

                    <button type="submit" class="login-submit-btn">
                        <i class="fas fa-arrow-right"></i> &nbsp; Sign In
                    </button>
                </form>

                <!-- Registration form (hidden by default) -->
                <form id="registerForm" action="/register" method="POST" class="hidden-form">
                    <div class="auth-title">Create Account</div>
                    <div class="auth-subtitle">Register a new account to save preferences</div>

                    <div class="form-group input-group">
                        <label class="input-label" for="regEmail">Email address</label>
                        <div class="input-wrapper">
                            <span class="input-icon"><i class="fas fa-envelope-open"></i></span>
                            <input type="email" id="regEmail" name="email" placeholder="you@example.com" required>
                        </div>
                    </div>

                    <div class="form-group input-group">
                        <label class="input-label" for="regPassword">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon"><i class="fas fa-key"></i></span>
                            <input type="password" id="regPassword" name="password" placeholder="Choose a strong password" required>
                        </div>
                    </div>

                    <button type="submit" class="login-submit-btn" id="registerBtn">Register</button>
                    <div class="switch-form mt-1">
                        Already have an account? <a href="#" id="backToLogin">Sign in</a>
                    </div>
                </form>

                <div class="meta-links">
                    <div>Don't have an account? <a href="#" id="signUpLink" class="register-link">Sign Up</a></div>
                    <a href="#" id="skipLink" class="skip-link">Skip and Browse Cars →</a>
                </div>

            </div>
        </div>
    </div>
    
    <script>
        const msgBox = document.getElementById('messageBox');
        
        function showMessage(message, type = 'error') {
            msgBox.textContent = message;
            msgBox.style.display = 'block';
            msgBox.style.backgroundColor = type === 'error' ? '#f8d7da' : '#d4edda';
            msgBox.style.color = type === 'error' ? '#721c24' : '#155724';
            msgBox.style.borderColor = type === 'error' ? '#f5c6cb' : '#c3e6cb';
            
            // Auto hide after 5 seconds
            setTimeout(() => { msgBox.style.display = 'none'; }, 5000);
        }

        // Intercept the login form and handle registration via fetch.
        (function() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const signUpLink = document.getElementById('signUpLink');
            const backToLoginLink = document.getElementById('backToLogin');

            function showLogin() {
                if (registerForm) registerForm.classList.add('hidden-form');
                if (loginForm) loginForm.classList.remove('hidden-form');
            }
            function showRegister() {
                if (loginForm) loginForm.classList.add('hidden-form');
                if (registerForm) registerForm.classList.remove('hidden-form');
            }

            // Toggle to registration form when user clicks Sign Up
            if (signUpLink) {
                signUpLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    showRegister();
                });
            }

            if (backToLoginLink) {
                backToLoginLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    showLogin();
                });
            }

            // Login handler (existing behavior)
            if (loginForm) {
                loginForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const formData = new FormData(loginForm);

                    fetch(loginForm.action || '/login', {
                        method: loginForm.method || 'POST',
                        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                        body: new URLSearchParams(formData).toString()
                    }).then(resp => {
                        if (resp.redirected) {
                            window.location.href = resp.url;
                            return;
                        }
                        if (resp.ok) {
                            window.location.href = 'dashboard.html';
                        } else {
                            return resp.text().then(t => showMessage(t || 'Login failed: Invalid credentials.', 'error'));
                        }
                    }).catch(err => {
                        console.warn('Login fetch failed, falling back to client-side redirect:', err);
                        window.location.href = 'dashboard.html';
                    });
                });
            }

            // Registration handler: POST to /register and expect JSON when successful
            if (registerForm) {
                registerForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const formData = new FormData(registerForm);

                    fetch(registerForm.action || '/register', {
                        method: registerForm.method || 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                            'Accept': 'application/json'
                        },
                        body: new URLSearchParams(formData).toString()
                    }).then(async resp => {
                        if (resp.ok) {
                            // If server returned JSON, parse and act accordingly
                            try {
                                const json = await resp.json();
                                if (json && json.success) {
                                    // Inform user that registration succeeded and return them to the login form
                                    showMessage('Registration successful. Please sign in with your new credentials.', 'success');
                                    // Switch back to the login form and prefill the email field so user can log in
                                    showLogin();
                                    try {
                                        const loginEmail = document.getElementById('email');
                                        const regEmail = document.getElementById('regEmail');
                                        const regPassword = document.getElementById('regPassword');
                                        if (loginEmail && regEmail) loginEmail.value = regEmail.value;
                                        if (regPassword) regPassword.value = '';
                                        // focus the password field on the login form for convenience
                                        const loginPassword = document.getElementById('password');
                                        if (loginPassword) loginPassword.focus();
                                    } catch (err) {
                                        // ignore DOM errors
                                    }
                                    return;
                                }
                            } catch (err) {
                                // If response wasn't JSON, fallback to redirect
                                window.location.href = '/';
                                return;
                            }
                        }

                        // If we reach here, treat as error
                        const text = await resp.text().catch(() => 'Registration failed');
                        showMessage(text || 'Registration failed', 'error');
                    }).catch(err => {
                        console.error('Registration request failed:', err);
                        showMessage('Registration failed. Is the server running?', 'error');
                    });
                });
            }
        })();

        // (Warning-related UI changes removed) — server-side error flag handling reverted.
        // Skip link behavior: show modal asking to log in or continue as guest
        (function() {
            const skipLink = document.getElementById('skipLink');
            const skipModal = document.getElementById('skipModal');
            const skipCancelBtn = document.getElementById('skipCancelBtn');
            const skipGuestBtn = document.getElementById('skipGuestBtn');
            const skipLoginBtn = document.getElementById('skipLoginBtn');
            const emailInput = document.getElementById('email');

            if (!skipLink || !skipModal) return;

            function openSkipModal() {
                skipModal.style.display = 'flex';
                skipModal.setAttribute('aria-hidden', 'false');
            }
            function closeSkipModal() {
                skipModal.style.display = 'none';
                skipModal.setAttribute('aria-hidden', 'true');
            }

            skipLink.addEventListener('click', function(e) {
                e.preventDefault();
                openSkipModal();
            });

            skipCancelBtn && skipCancelBtn.addEventListener('click', function() {
                closeSkipModal();
            });

            skipGuestBtn && skipGuestBtn.addEventListener('click', function() {
                // Continue to dashboard as guest
                window.location.href = 'dashboard.html';
            });

            skipLoginBtn && skipLoginBtn.addEventListener('click', function() {
                // Close modal and focus the login form so the user can sign in
                closeSkipModal();
                if (emailInput) {
                    emailInput.focus();
                    // Optionally scroll to top where the form is
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
        })();
    </script>
        <script>
            // Trigger small entrance animations when the page loads
            document.addEventListener('DOMContentLoaded', function () {
                const card = document.querySelector('.auth-card');
                const logo = document.querySelector('.logo-pill');
                const submitBtn = document.querySelector('.login-submit-btn');
                // small timeout so the browser can paint initial state first
                setTimeout(() => {
                    if (card) card.classList.add('animate-in');
                    if (logo) logo.classList.add('float');
                    if (submitBtn) submitBtn.setAttribute('aria-live', 'polite');
                }, 80);
            });
        </script>
</body>
</html>
